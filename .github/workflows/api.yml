name: api

on:
  push:
    branches: [master]
    paths:
      - 'api/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'api/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wuppa
          POSTGRES_PASSWORD: wuppa
          POSTGRES_DB: wuppa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wuppa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.mod
      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: CI
        run: make -C api ci
