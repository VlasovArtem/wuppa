name: api

on:
  push:
    branches: [master]
    paths:
      - 'api/**'
      - '.github/workflows/api.yml'
  pull_request:
    paths:
      - 'api/**'
      - '.github/workflows/api.yml'

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wuppa
          POSTGRES_PASSWORD: wuppa
          POSTGRES_DB: wuppa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wuppa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.mod
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15
          install-only: true
      - name: CI
        run: make -C api ci
