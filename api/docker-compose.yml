name: wuppa

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: wuppa
      POSTGRES_PASSWORD: wuppa
      POSTGRES_DB: wuppa
    ports:
      - "5432:5432"
    volumes:
      - wuppa-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wuppa -d wuppa"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.21.8
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  wuppa-db:
